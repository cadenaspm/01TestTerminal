name: Release

# Se dispara cuando cambia la versión en package.json (push a master) o a mano.
# La versión del package.json es la fuente de verdad: de ahí sale el tag (v1.0.0).
on:
  push:
    branches:
      - master
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Un único job (no una matriz): la suite de tests corre una sola vez en vez de
  # seis, y el runner se gasta la mitad de minutos para el mismo resultado.
  release:
    name: Compilar y publicar
    # Imagen fijada a propósito: `ubuntu-latest` está migrando a Ubuntu 26 y un
    # release debe ser reproducible. Cambiar a `ubuntu-24.04` cuando toque.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Leer y validar la versión
        id: pkg
        run: |
          VERSION=$(jq -r '.version // empty' package.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::La versión '$VERSION' del package.json no es un semver válido."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Gate completo: tests + typecheck + binario nativo. Si algo falla, no se
      # compila ninguna otra plataforma ni se publica nada.
      - name: Construir el binario nativo (tests + typecheck)
        run: bun run build

      - name: Compilar el resto de plataformas
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # El runner de ubuntu es x64: este binario ES el asset de Linux x64.
          mv weather "dist/weather-${VERSION}-linux-x64"
          for target in bun-windows-x64 bun-windows-arm64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            case "$target" in
              bun-windows-x64)   archivo="windows-x64.exe" ;;
              bun-windows-arm64) archivo="windows-arm64.exe" ;;
              bun-linux-arm64)   archivo="linux-arm64" ;;
              bun-darwin-x64)    archivo="darwin-x64" ;;
              bun-darwin-arm64)  archivo="darwin-arm64" ;;
            esac
            echo "Compilando ${target} -> dist/weather-${VERSION}-${archivo}"
            BUN_TARGET="$target" BUN_OUTFILE="dist/weather-${VERSION}-${archivo}" bun run compile:target
          done

      - name: Calcular los checksums
        run: (cd dist && sha256sum weather-* > checksums.txt)

      # Se publica también como artefacto del run para poder descargarlo si la
      # creación de la release falla.
      - name: Publicar los binarios como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: weather-${{ steps.pkg.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Crear el tag y la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pkg.outputs.tag }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::La release $TAG ya existe: no se vuelve a publicar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::El tag $TAG ya existe en el remoto: se reutiliza."
          else
            git tag -a "$TAG" -m "Weather CLI v$VERSION"
            git push origin "$TAG"
          fi

          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$TAG" \
            --title "Weather CLI v$VERSION" \
            --generate-notes \
            --notes-file .github/release-notes.md \
            $PRERELEASE \
            dist/weather-* \
            dist/checksums.txt
